<script>
/* ===== GERBANG LOGIN (akun sama dengan index.html: member + admin) ===== */
window.WB_GATE=(function(){
  const CFG=(function(){
    const WK='https://steep-resonance-6a71.kjago7822.workers.dev',HOST=String(window.__WB_HOST||location.hostname||'').toLowerCase();
    const SITE_MAP={   // dikenali dari alamat situs: satu file ini dipakai semua situs tanpa wb-config.js
      'mamakeavif-star.github.io':{worker:WK,account:'mamakeavif-star',system:'wbp',bank:{prefix:'wbp_bank__',field:'bankBin',pack:true,defaultLimit:100}},
      'kjago7822.github.io':{worker:WK,account:'kjago7822',system:'legacy',bank:{prefix:'wbidx_bank__',field:'bankBinKJ',defaultLimit:100}},
      'adinealif-byte.github.io':{worker:WK,account:'adinealif-byte',system:'legacy',bank:{prefix:'wbidx_bank__',field:'bankBin',defaultLimit:100}},
      'wgus543-hub.github.io':{worker:WK,account:'wgus543-hub',system:'legacy',memberKey:'wg_logged_member',adminKey:'wg_admin_cred',bank:{prefix:'wg_bank__',field:'bankBinWG',defaultLimit:100}}
    };
    if(window.WB_STORE)return window.WB_STORE;
    if(SITE_MAP[HOST])return SITE_MAP[HOST];
    const W=window.WB_CONFIG;   // situs dengan wb-config.js + wb-member-bank.js (WB_CONFIG): akun & kunci sesi dihitung sama seperti wb-member-bank.js
    if(W&&W.WORKER){
      let a;
      if(W.ACCT)a=String(W.ACCT);
      else{const h=location.hostname.toLowerCase();
        if(!h||location.protocol==='file:')a='local';
        else{a=h.replace(/^www\./,'');
          if(/\.github\.io$/.test(a)){const u=a.split('.')[0],sg=(location.pathname.split('/')[1]||'');a=u+((sg&&sg.indexOf('.')<0)?'-'+sg.toLowerCase():'');}
          a=a.replace(/[^a-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'local';}}
      return{worker:W.WORKER,account:a,system:'wbp',suffix:'@'+a};
    }
    return{worker:'',account:''};
  })();
  const SITE=location.hostname+'/'+(location.pathname.split('/')[1]||'');
  const WBP=(CFG.system==='wbp');   // situs bersistem WBP (index.html satu halaman, kunci wbp_member / wbp_admin)
  const LEG=(CFG.system==='legacy');   // index.html versi lama satu halaman: kunci wb_logged_member / wb_admin_cred (tanpa akhiran situs)
  const LK=WBP?'wbp_member'+(CFG.suffix||''):LEG?(CFG.memberKey||'wb_logged_member'):'wb_logged_member__'+SITE,AK=WBP?'wbp_admin'+(CFG.suffix||''):LEG?(CFG.adminKey||'wb_admin_cred'):'wb_admin_cred__'+SITE;
  const base=(CFG.worker||'').replace(/\/+$/,'')+'/'+CFG.account;
  const g=id=>document.getElementById(id);
  function lock(msg,needLogin,retry){
    document.body.classList.add('locked');
    g('gmsg').textContent=msg;
    g('gLogin').style.display=needLogin?'block':'none';
    g('gRetry').style.display=retry?'block':'none';
  }
  function cur(){try{return JSON.parse(localStorage.getItem(LK)||'null');}catch{return null;}}
  async function verify(){
    if(!CFG.worker||!CFG.account)return{ok:false,msg:'wb-config.js tidak terbaca. Pastikan file wb-config.js ada di folder yang sama.',retry:true};
    const m=cur();
    if(!m)return{ok:false,msg:'Harus login dulu. Tanpa akun member atau admin tidak bisa masuk.',login:true};
    if(m.isAdmin){
      let c=null;try{c=JSON.parse(localStorage.getItem(AK)||'null');}catch{}
      if(!(c&&c.token&&c.exp>Date.now())){localStorage.removeItem(AK);localStorage.removeItem(LK);return{ok:false,msg:'Sesi admin habis. Login admin lagi.',login:true};}
      return{ok:true,m};
    }
    let list;
    try{
      let path='/members';
      if(WBP){   // daftar member ada di bin yang ditunjuk key "logs"
        const rl=await fetch(base+'/logs?_='+Date.now(),{cache:'no-store'});
        if(!rl.ok)throw new Error('HTTP '+rl.status);
        const lg=await rl.json();const mb=lg&&!Array.isArray(lg)&&lg.membersBin;
        if(!mb)throw new Error('bin member belum ada');
        path='/'+mb;
      }
      const r=await fetch(base+path+'?_='+Date.now(),{cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const rec=await r.json();list=Array.isArray(rec)?rec:((rec&&rec.data)||[]);
    }catch(e){return{ok:false,msg:'Koneksi ke server gagal. Coba lagi.',retry:true};}
    const f=list.find(x=>x.id===m.id||(m.phone&&x.phone===m.phone));
    const contact=((list.find(x=>x.id==='__SETTINGS__')||{}).contact)||'';
    if(!f){localStorage.removeItem(LK);return{ok:false,msg:'Akun tidak ditemukan. Login atau daftar dulu.',login:true};}
    if(f.status==='blocked'){localStorage.removeItem(LK);return{ok:false,msg:'🚫 Akun kamu diblokir admin.'+(contact?' Hubungi: '+contact:''),login:true};}
    if(f.status==='pending'){localStorage.removeItem(LK);return{ok:false,msg:'⏳ Akun kamu belum di-ACC admin.',login:true};}
    const today=new Date().toISOString().slice(0,10);
    if(f.expiresAt&&today>=f.expiresAt){localStorage.removeItem(LK);return{ok:false,msg:'⏰ Masa aktif habis ('+f.expiresAt+').'+(contact?' Hubungi admin: '+contact:''),login:true};}
    const stg=list.find(x=>x.id==='__SETTINGS__')||{},gl=stg.globalLock||stg.locked||[];
    const FK=window.WB_FEATURE_KEYS||['prediksi'];
    if(FK.some(k=>gl.includes(k)||(f.locked||[]).includes(k)))return{ok:false,msg:'🔒 Fitur dikunci oleh Admin.'+(contact?' Hubungi: '+contact:''),locked:true};
    try{const o=cur();if(o&&!o.isAdmin){o.bankLimit=f.bankLimit;o.predBankLimit=f.predBankLimit;o.predMktLimit=f.predMktLimit;localStorage.setItem(LK,JSON.stringify(o));}}catch{}   // aturan terbaru dari admin
    return{ok:true,m:f};
  }

  /* ===== BANK AKUN untuk situs tanpa wb-member-bank.js (bank ada di dalam index.html) =====
     Memakai penyimpanan yang sama dengan index.html: kunci lokal <prefix><akun>__<app> dan bin bank member di server. */
  function liteBank(B){
    const who=()=>{const u=cur();return u?String(u.phone||u.id||'guest').toLowerCase().replace(/[^a-z0-9]/g,'_'):'guest';};
    const k=a=>B.prefix+who()+'__'+(a||'default');
    const rd=a=>{try{return JSON.parse(localStorage.getItem(k(a))||'[]');}catch{return[];}};
    const pack=(it,c)=>{if(!B.pack||!it||!Array.isArray(it.trekRows))return it;const o=Object.assign({},it);delete o.trekRows;o.tr=it.trekRows.slice(-c).map(r=>[r.result,r.predStr,r.hit===null||r.hit===undefined?null:(r.hit?1:0)]);return o;};
    const unpack=it=>{if(!it||!Array.isArray(it.tr))return it;const o=Object.assign({},it);delete o.tr;o.trekRows=it.tr.map(r=>r.length>=4?({result:r[0],resultHit:r[1],predStr:r[2],pred:(r[2]&&r[2]!=='??')?String(r[2]).split('').map(Number):[],hit:r[3]===null?null:!!r[3]}):({result:r[0],predStr:r[1],pred:(r[1]&&r[1]!=='??')?String(r[1]).split('').map(Number):[],hit:r[2]===null?null:!!r[2]}));return o;};
    const isMem=()=>{const u=cur();return !!(u&&!u.isAdmin&&u.id);};
    const lim=a=>{const u=cur();if(!u||u.isAdmin)return 0;if(/^prediksi/.test(a||'')){const p=parseInt(u.predBankLimit,10);return p>0?p:20;}const n=parseInt(u.bankLimit,10);return n>0?n:(B.defaultLimit||0);};   // aturan admin: predBankLimit (bawaan 20) untuk Bank Prediksi
    const predMk=()=>{const u=cur();if(!u||u.isAdmin)return 0;const n=parseInt(u.predMktLimit,10);return n>0?n:10;};   // aturan admin: predMktLimit (bawaan 10 pasaran)
    const slim=(a,i)=>{if(!/^prediksi/.test(a||'')||!i||typeof i!=='object')return i;const o=Object.assign({},i);delete o.trekRows;delete o.curPred;delete o.baseResult;delete o.tr;return o;};   // trek dihitung ulang dari data result
    let ready=false,dirty=new Set(),timer=null,chain=Promise.resolve(),binId=null;const cbs=[];const info={err:null,member:null,bin:null,apps:null};
    const toastB=m=>{try{if(window.toast)window.toast(m,3000);else alert(m);}catch{}};
    async function getJ(path){const r=await fetch(base+path+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
    async function members(){
      let path='/members';
      if(WBP){const lg=await getJ('/logs');const mb=lg&&!Array.isArray(lg)&&lg.membersBin;if(!mb)throw new Error('bin member belum ada');path='/'+mb;}
      const rec=await getJ(path);return Array.isArray(rec)?rec:((rec&&rec.data)||[]);
    }
    async function myBin(){
      if(binId)return binId;const u=cur();const m=(await members()).find(x=>x.id===u.id&&x.id!=='__SETTINGS__');
      if(!m)throw new Error('Akun tidak ditemukan di server');binId=(B.field&&m[B.field])||m[Object.keys(m).find(x=>/^bankBin/.test(x))||'']||null;return binId;
    }
    async function readBin(id){const rec=await getJ('/'+id);const o=(rec&&rec.data&&!Array.isArray(rec.data))?rec.data:rec;return(o&&!Array.isArray(o))?o:{};}
    async function push(){
      if(!isMem()){dirty.clear();return;}
      const apps=[...dirty];dirty.clear();if(!apps.length)return;
      try{
        const bin=await myBin();
        if(!bin){toastB('⚠️ Bank tersimpan di HP ini saja. Buka halaman utama sekali agar bank terhubung ke server.');return;}
        const cur0=await readBin(bin);let cap=[1e9,12,8,5,3],out=null;
        for(const c of (B.pack?cap:[1e9])){out=Object.assign({},cur0);apps.forEach(a=>{out[a]=rd(a).map(i=>slim(a,pack(i,c)));});out.updatedAt=new Date().toISOString();out.owner=(cur()||{}).name||out.owner;
          if(JSON.stringify({data:out}).length<=190000)break;out=null;}
        if(!out){toastB('⚠️ Bank kepenuhan (batas 190KB). Hapus beberapa rumus lama.');apps.forEach(a=>dirty.add(a));return;}
        const r=await fetch(base+'/'+bin,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:out})});
        if(!r.ok)throw new Error('HTTP '+r.status);

<script type="text/plain" id="engineSrc">/* ===== ENGINE (sama rumus dengan scan1–scan5: elemen A C K E J Js Jt Jd J3D J4D, op + - ×, mod ix ty ml mb m0–m19) ===== */
const MOD_TABLE={ix:[5,6,7,8,9,0,1,2,3,4],ty:[7,4,9,6,1,8,3,0,5,2],ml:[1,0,5,8,7,2,9,4,3,6],mb:[8,7,6,9,5,4,2,1,0,3],
m0:[6,5,8,7,9,1,0,3,2,4],m1:[1,0,9,8,7,6,5,4,3,2],m2:[2,8,0,9,7,6,5,4,1,3],m3:[3,2,1,0,9,8,7,6,5,4],
m4:[6,5,3,2,7,1,0,4,9,8],m5:[5,4,3,2,1,0,9,8,7,6],m6:[6,8,4,5,2,3,0,9,1,7],m7:[7,6,5,4,3,2,1,0,9,8],
m8:[8,7,6,5,9,3,2,1,0,4],m9:[9,8,7,6,5,4,3,2,1,0],m10:[4,2,1,8,0,6,5,9,3,7],m11:[1,0,5,4,3,2,8,9,6,7],
m12:[2,7,0,8,6,9,4,1,3,5],m13:[3,9,7,0,6,8,4,2,5,1],m14:[6,5,4,7,2,1,0,3,9,8],m15:[5,6,4,9,2,0,1,8,7,3],
m16:[3,8,7,0,9,6,5,2,1,4],m17:[9,4,8,6,1,7,3,5,2,0],m18:[8,9,7,4,3,6,5,2,0,1],m19:[7,8,3,2,9,6,5,0,1,4]};
const ALL_MODS=[null,'ix','ty','ml','mb','m0','m1','m2','m3','m4','m5','m6','m7','m8','m9','m10','m11','m12','m13','m14','m15','m16','m17','m18','m19'];
const COL_MAP={A:0,B:1,C:2,D:3,E:4,F:5,G:6,H:7,I:8,J:9};
const COL_LETTERS='ABCDEFGHIJ';
function dr(n){n=Math.abs(n);return n===0?0:(n%9===0?9:n%9);}
/* --- jalur lambat (dipakai untuk rumus Bank akun; identik dengan scan) --- */
function applyMod(v,mod){if(!mod)return v;const t=MOD_TABLE[mod.toLowerCase()];return t?t[((v%10)+10)%10]:v;}
function getElem(type,put,hist){
  const r=hist[put-1];if(!r||r.length<4)return null;
  const A=+r[0],C=+r[1],K=+r[2],E=+r[3];
  switch(type.toUpperCase()){
    case'A':return A;case'C':return C;case'K':return K;case'E':return E;
    case'J':return dr(K+E);case'JS':return dr(Math.abs(K-E));
    case'JT':return dr(C+K);case'JD':return dr(A+C);
    case'J3D':return dr(C+K+E);case'J4D':return dr(A+C+K+E);
    default:return null;}
}
function baseN(elems,ops,modF,hist){
  const vals=elems.map(el=>{let v=getElem(el.type,el.put,hist);if(v===null)return null;if(el.mod)v=applyMod(v,el.mod);return v;});
  if(vals.some(v=>v===null))return null;
  let acc=vals[0];
  for(let i=1;i<vals.length;i++){const op=ops[i-1]||'+';let raw;
    if(op==='+')raw=acc+vals[i];else if(op==='-')raw=Math.abs(acc-vals[i]);else raw=acc*vals[i];acc=dr(raw);}
  return modF?applyMod(acc,modF):acc;
}
function tokenize(kp){
  const TYPES='J3D|J4D|JD|JT|JS|J|A|C|K|E',MODS='M\\d+|ML|MB|IX|TY';
  const TR=new RegExp(`^(${TYPES})$`,'i'),MR=new RegExp(`^(${MODS})$`,'i');
  const tokens=Array.from(kp.matchAll(new RegExp(`(${MODS}|${TYPES}|\\d+|[+\\-×.])`,'gi')),m=>m[1].toUpperCase());
  const parts=[],ops=[];let cur='+',modF=null,i=0;
  while(i<tokens.length){const t=tokens[i];
    if(TR.test(t)){const typ=t;i++;let put=1;
      if(i<tokens.length&&/^\d+$/.test(tokens[i])){put=+tokens[i];i++;}
      let mod=null;if(i<tokens.length&&MR.test(tokens[i])){mod=tokens[i].toLowerCase();i++;}
      ops.push(cur);parts.push({type:typ,put,mod});cur='+';
    }else if(t==='+'||t==='-'||t==='×'){cur=t;i++;}
    else if(t==='.'){
      if(i+1<tokens.length&&TR.test(tokens[i+1])){cur='×';i++;}
      else if(i+1<tokens.length&&MR.test(tokens[i+1])){modF=tokens[i+1].toLowerCase();i+=2;}
      else i++;
    }else if(MR.test(t)){modF=t.toLowerCase();i++;}
    else i++;}
  return{parts,ops,modF};
}
function parseKey(raw){
  try{
    const str=String(raw).trim().toUpperCase();const lu=str.lastIndexOf('_');if(lu<0)return null;
    const keyPart=str.slice(0,lu),colStr=str.slice(lu+1);
    const cols=colStr.split('').map(c=>COL_MAP[c]).filter(x=>x!==undefined);if(!cols.length)return null;
    const{parts,ops,modF}=tokenize(keyPart);if(!parts.length||parts.length>6)return null;
    const chainOps=ops.slice(1);
    const fn=parts.length===1
      ?((hist)=>{const{type,put,mod}=parts[0];const v=getElem(type,put,hist);if(v===null)return null;return(modF||mod)?applyMod(v,modF||mod):v;})
      :((hist)=>baseN(parts,chainOps,modF,hist));
    return{fn,keyStr:keyPart,cols,colStr,nDigit:cols.length};
  }catch{return null;}
}
function predFromCols(base,cols){return cols.map(i=>(base+i)%10);}
function isHit(result,pred,mode){
  if(!result||result.length<4)return false;
  const A=+result[0],C=+result[1],K=+result[2],E=+result[3];
  switch(mode){
    case'ai_ke':return pred.includes(K)||pred.includes(E);
    case'ai_depan':return pred.includes(A)||pred.includes(C);
    case'ai_tengah':return pred.includes(C)||pred.includes(K);
    case'bbfs_ke':return K===E?pred.includes(K):(pred.includes(K)&&pred.includes(E));
    case'bbfs_ac':return A===C?pred.includes(A):(pred.includes(A)&&pred.includes(C));
    case'bbfs_ck':return C===K?pred.includes(C):(pred.includes(C)&&pred.includes(K));
    case'bbfs_4d':{const s=new Set([A,C,K,E]);return[...s].every(d=>pred.includes(d));}
    case'pos_ek':return pred.includes(E);case'pos_kp':return pred.includes(K);
    case'pos_as':return pred.includes(A);case'pos_cp':return pred.includes(C);
    case'off_ke':return K===E?!pred.includes(K):(!pred.includes(K)&&!pred.includes(E));
    case'off_ac':return A===C?!pred.includes(A):(!pred.includes(A)&&!pred.includes(C));
    case'off_ck':return C===K?!pred.includes(C):(!pred.includes(C)&&!pred.includes(K));
    case'off_4d':{const s=new Set([A,C,K,E]);return[...s].every(d=>!pred.includes(d));}
    default:return pred.includes(K)||pred.includes(E);}
}
/* --- jalur cepat (auto-scan): bitmask digit + gugur bertahap --- */
const MODE_DEF={ // [tipe, posisi target]  any = salah satu ada, all = semua ada, none = tidak ada satupun
  ai_ke:['any',[2,3]],ai_depan:['any',[0,1]],ai_tengah:['any',[1,2]],
  bbfs_ke:['all',[2,3]],bbfs_ac:['all',[0,1]],bbfs_ck:['all',[1,2]],bbfs_4d:['all',[0,1,2,3]],
  pos_ek:['any',[3]],pos_kp:['any',[2]],pos_as:['any',[0]],pos_cp:['any',[1]],
  off_ke:['none',[2,3]],off_ac:['none',[0,1]],off_ck:['none',[1,2]],off_4d:['none',[0,1,2,3]]};
function combosOf(n){const out=[];(function rec(st,cur){if(cur.length===n){out.push(cur.slice());return;}for(let d=st;d<10;d++){cur.push(d);rec(d+1,cur);cur.pop();}})(0,[]);return out;}
function buildTables(hist){
  const n=hist.length,T={A:[],C:[],K:[],E:[],J:[],JS:[],JT:[],JD:[],J3D:[],J4D:[]};
  for(let i=0;i<n;i++){const r=hist[i],A=+r[0],C=+r[1],K=+r[2],E=+r[3];
    T.A.push(A);T.C.push(C);T.K.push(K);T.E.push(E);
    T.J.push(dr(K+E));T.JS.push(dr(Math.abs(K-E)));T.JT.push(dr(C+K));T.JD.push(dr(A+C));T.J3D.push(dr(C+K+E));T.J4D.push(dr(A+C+K+E));}
  return T;
}
function buildCtx(hist,modes,nDigit){
  const T=buildTables(hist),digs=[T.A,T.C,T.K,T.E];
  const cols=combosOf(nDigit),cm=cols.map(c=>c.reduce((m,d)=>m|(1<<d),0));
  const tm={};modes.forEach(m=>{const pos=MODE_DEF[m][1];tm[m]=hist.map((_,i)=>pos.reduce((a,p)=>a|(1<<digs[p][i]),0));});
  return{T,cols,cm,tm,modes,nDigit,n:hist.length};
}
const ROT=(m,s)=>((m<<s)|(m>>(10-s)))&1023;
function runFormula(ctx,getBase,scanP,emit){
  const {cm,cols,modes,tm}=ctx,C=cm.length,M=modes.length;
  let act=[];for(let m=0;m<M;m++)for(let c=0;c<C;c++)act.push(m*C+c);
  const types=modes.map(m=>MODE_DEF[m][0]);
  let i=1;
  for(;i<ctx.n&&act.length;i++){
    const s=getBase(i);if(s<0)break;
    const next=[];
    for(let a=0;a<act.length;a++){const id=act[a],m=(id/C)|0,c=id-m*C;
      const pm=ROT(cm[c],s),t=tm[modes[m]][i-1],ty=types[m];
      const ok=ty==='any'?(pm&t)!==0:ty==='all'?(pm&t)===t:(pm&t)===0;
      if(ok)next.push(id);else if(i-1>=scanP)emit(m,c,i-1);}
    act=next;
    if(i<=scanP&&!act.length)return;
  }
  if(i-1>=scanP)for(const id of act){const m=(id/C)|0;emit(m,id-m*C,i-1);}
}
function* formulaGen(T,n,opt){ // fase k = k elemen; posisi ke-j memakai rentang put els[j-1] (sama seperti Scan)
  const ET=['A','C','K','E','J','JS','JT','JD','J3D','J4D'],ET2=['A','C','K','E','J'];
  const els=opt.els,OPS=['+','-','×'];
  const nm=t=>t==='JS'?'Js':t==='JT'?'Jt':t==='JD'?'Jd':t;
  const range=(a,b)=>{const r=[];for(let q=a;q<=b;q++)r.push(q);return r;};
  const stepOp=(op,u,v)=>dr(op==='+'?u+v:op==='-'?Math.abs(u-v):u*v);
  for(let k=1;k<=6;k++){
    if(!els[k-1]||!els[k-1].on)continue;
    const rg=[];for(let q=0;q<k;q++){const e=els[q]||{lo:1,hi:5};rg.push(range(Math.max(1,e.lo|0),Math.max(e.lo|0,e.hi|0)));}
    if(k===1){
      for(const t of ET)for(const pp of rg[0])for(const mod of ALL_MODS){
        const tab=T[t],mt=mod?MOD_TABLE[mod]:null;
        yield{key:`${nm(t)}${pp}${mod?'.'+mod:''}`,get:i=>{const x=i+pp-1;if(x>=n)return -1;const v=tab[x];return mt?mt[v]:v;}};
      }
      continue;
    }
    // k>=2: pilih tipe, put, dan operator tiap posisi
    const types=[],puts=[],ops=[];
    function* rec(d){
      if(d===k){
        const tb=types.map(t=>T[t]),pt=puts.slice(),op=ops.slice(),base=types.map((t,q)=>`${nm(t)}${pt[q]}`);
        let key0=base[0];for(let q=1;q<k;q++)key0+=op[q-1]+base[q];
        const pre=i=>{let acc=-1;for(let q=0;q<k;q++){const x=i+pt[q]-1;if(x>=n)return -1;const v=tb[q][x];acc=q===0?v:stepOp(op[q-1],acc,v);}return acc;};
        for(const mod of ALL_MODS){const mt=mod?MOD_TABLE[mod]:null;
          yield{key:key0+(mod?'.'+mod:''),get:mt?(i=>{const b0=pre(i);return b0<0?-1:mt[b0];}):pre};}
        return;
      }
      for(const t of ET2)for(const pp of rg[d]){
        types[d]=t;puts[d]=pp;
        if(d===0)yield*rec(1);
        else for(const o of OPS){ops[d-1]=o;yield*rec(d+1);}
      }
    }
    yield*rec(0);
  }
}
function estFormulas(els){ // perkiraan jumlah rumus per pasaran (25 modifier termasuk tanpa mod)
  let tot=0;
  for(let k=1;k<=6;k++){
    if(!els[k-1]||!els[k-1].on)continue;
    let c=1;
    for(let q=0;q<k;q++){const e=els[q]||{lo:1,hi:5};const np=Math.max(1,(e.hi|0)-(e.lo|0)+1);c*=np*(k===1?10:(q===0?5:5*3));}
    tot+=c*ALL_MODS.length;
  }
  return tot;
}
function scanMarket(hist,opt,onTick){
  // opt: {scanP,nDigit,modes[],els[6]{on,lo,hi},maxOut,stopAfter,budget}
  if(hist.length<opt.scanP+2)return[];
  const ctx=buildCtx(hist,opt.modes,opt.nDigit);let out=[],seen=new Set();
  const CAP=Math.max((opt.maxOut||0)*5,4000);   // batas memori: simpan hanya trek terbaik
  const prune=()=>{out.sort((a,b)=>b.streak-a.streak);out=out.slice(0,opt.maxOut||CAP);seen=new Set(out.map(o=>o.sig));};
  let cnt=0;const lim=opt.work?Math.floor(opt.work/(ctx.cols.length*opt.modes.length)):(opt.budget||0);
  for(const f of formulaGen(ctx.T,ctx.n,opt)){
    cnt++;if(lim&&cnt>lim)break;
    const s0=f.get(0);if(s0<0)continue;
    runFormula(ctx,f.get,opt.scanP,(m,c,streak)=>{
      const cols=ctx.cols[c],pred=cols.map(d=>(s0+d)%10);
      const mode=opt.modes[m];
      // dedup: mode + urutan prediksi selama trek (sama seperti dedup 'sig' di scan)
      let sig=mode+'|';for(let r=1;r<=streak;r++){sig+=ROT(ctx.cm[c],f.get(r)).toString(36)+',';}
      sig+=ROT(ctx.cm[c],s0).toString(36);
      if(seen.has(sig))return;seen.add(sig);
      out.push({key:`${f.key}_${cols.map(d=>COL_LETTERS[d]).join('')}`,mode,nDigit:opt.nDigit,cols,streak,curPred:pred,sig});
      if(out.length>=CAP)prune();
    });
    if(onTick&&(cnt&2047)===0)onTick(cnt);
    if(opt.stopAfter&&out.length>=opt.stopAfter)break;
  }
  out.sort((a,b)=>b.streak-a.streak);
  if(opt.maxOut&&out.length>opt.maxOut)out=out.slice(0,opt.maxOut);
  return out.map(o=>{const{sig,...r}=o;return r;});
}
/* --- rekap suara (logika sama dengan Rekap Otomatis di scan) --- */
const RK_M={ai_ke:[[2,3],'or'],ai_depan:[[0,1],'or'],ai_tengah:[[1,2],'or'],bbfs_ke:[[2,3],'and'],bbfs_ac:[[0,1],'and'],bbfs_ck:[[1,2],'and'],bbfs_4d:[[0,1,2,3],'and'],
 pos_ek:[[3],'and'],pos_kp:[[2],'and'],pos_as:[[0],'and'],pos_cp:[[1],'and'],off_ke:[[2,3],'off'],off_ac:[[0,1],'off'],off_ck:[[1,2],'off'],off_4d:[[0,1,2,3],'off']};
const RK_T={'2b':[2,3],'3b':[1,2,3],'4':[0,1,2,3]};
function rekap(forms,P,topN,weighted){
  const F=[];
  forms.forEach(b=>{const m=RK_M[b.mode];if(!m||!b.curPred||!b.curPred.length)return;
    const pos=m[0].filter(x=>P.includes(x));
    if(!pos.length||(m[1]==='or'&&pos.length<m[0].length))return;
    let set=0;b.curPred.forEach(d=>{if(d>=0&&d<=9)set|=1<<d;});
    F.push({pos:pos.map(x=>P.indexOf(x)),t:m[1],set,w:weighted?Math.max(1,b.streak||1):1});});
  const T=F.reduce((s,f)=>s+f.w,0);if(!F.length)return{n:0,T:0,list:[]};
  const L=P.length,N=Math.pow(10,L),list=[];
  for(let i=0;i<N;i++){const d=[];let x=i;for(let k=L-1;k>=0;k--){d[k]=x%10;x=(x-d[k])/10;}
    let sc=0;
    for(let j=0;j<F.length;j++){const f=F[j];let ok;

function copyRek(mk){const t=rekText(mk);if(!t){toast('Belum ada rumus aktif');return;}copyText(wrapText(t));}
function copyAllRek(){
  if(TAB==='own'){const a=ownLive()||[];if(!a.length){toast('Bank masih kosong');return;}copyText(a.map(itemText).join('\n\n'));return;}
  const mks=new Set();(ownLive()||[]).concat(scanItems()).forEach(b=>mks.add(b.mkt));
  const t=[...mks].sort((a,b)=>minsToClose(a)-minsToClose(b)).map(rekText).filter(Boolean).join('\n\n');
  if(!t){toast('Belum ada rumus aktif');return;}copyText(wrapText(t));
}
function ownUpdateOne(id){const a=ownGet()||[],i=a.findIndex(b=>String(b.id)===String(id));if(i<0)return;const nw=ownRecompute(a[i]);if(!nw){toast('Rumus tidak bisa dihitung');return;}nw.updatedAt=fmtNow();const o=a.slice();o[i]=nw;ownSet(o);render();toast('🔄 Diperbarui');}
function ownDel(id){if(!confirm('Hapus rumus ini dari Bank Prediksi?'))return;ownSet((ownGet()||[]).filter(b=>String(b.id)!==String(id)));OPEN.delete('o'+id);render();}
function ownDelAll(){   // kosongkan seluruh Bank Prediksi (kalau simpan penuh): lalu scan ulang di Prediksi Otomatis dan Simpan Semua ke Bank
  const a=ownGet()||[],n=a.length;
  if(!n){toast('Bank Prediksi sudah kosong');return;}
  if(!confirm('Hapus SEMUA '+n+' rumus di Bank Prediksi?\nTidak bisa dibatalkan. Setelah itu buka Prediksi Otomatis, scan ulang, lalu tekan Simpan Semua ke Bank.'))return;
  if(!confirm('Yakin? Semua '+n+' rumus akan hilang.'))return;
  if(!ownSet([])){toast('⚠️ Gagal mengosongkan bank');return;}
  render();toast('🗑 Bank Prediksi dikosongkan ('+n+' rumus)');
}
function ownDelPatah(){const a=ownLive()||[],pt=new Set(a.filter(b=>b.status==='patah').map(b=>String(b.id))),n=pt.size;if(!n){toast('Tidak ada rumus patah');return;}if(!confirm('Hapus '+n+' rumus patah?'))return;ownSet((ownGet()||[]).filter(b=>!pt.has(String(b.id))));render();toast('🗑 '+n+' rumus patah dihapus');}
function importScan(id){
  const b=scanItems().find(x=>String(x.id==null?x.key:x.id)===String(id));if(!b)return;
  const cur=ownGet();if(!cur){toast('Bank akun belum terbaca');return;}
  if(cur.some(x=>x.mkt===b.mkt&&x.key===b.key)){toast('⚠️ Sudah ada di Bank Prediksi');return;}
  let room=Infinity;try{room=WB_BANK.room(OWN_ID,Infinity);}catch{}
  if(room<=0){toast('⚠️ Bank penuh',2200);return;}
  const it={...b};delete it._src;it.id=Date.now()+Math.floor(Math.random()*1e6);it.savedAt=new Date().toLocaleDateString('id-ID');it.maxStreak=Math.max(b.maxStreak||0,b.streak||0);
  ownSet(cur.concat([it]));toast('💾 Disimpan ke Bank Prediksi');render();
}
function afterData(){ownUpdateAll(true);render();}
async function reloadData(){await fetchData();afterData();toast(LIVE?'🌐 Data diperbarui':'⚠️ Offline, memakai data tersimpan');}
function updateAllBtn(){ownUpdateAll(false);render();}
/* ---- mulai ---- */
(async function start(){
  await window.WB_GATE.ready;
  await fetchData();
  try{
    WB_BANK.onReady(()=>{afterData();},OWN_ID);                       // bank sendiri (bin 'prediksi')
    SCAN_IDS.forEach(id=>WB_BANK.onReady(()=>{render();},id));        // bank scan1-5 (hanya baca)
  }catch{$('subBank').textContent='Bank akun: tidak terbaca';}
  render();
  setInterval(async()=>{await fetchData();afterData();},REFRESH_MS);
  document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&Date.now()-LASTFETCH>10*60*1000){await fetchData();afterData();}});
  setInterval(()=>{if(TAB!=='own')return;},60000);
})();
</script>
